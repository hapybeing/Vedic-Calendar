function calcJulian(date) {
    let y = date.getUTCFullYear();
    let m = date.getUTCMonth() + 1;
    const d = date.getUTCDate() + (date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600)/24;
    if (m <= 2) {
        y -= 1;
        m += 12;
    }
    const a = Math.floor(y / 100);
    const b = 2 - a + Math.floor(a / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5;
}

function processMath() {
    const now = new Date();
    const jd = calcJulian(now);
    const T = (jd - 2451545.0) / 36525;
    const D = jd - 2451545.0;

    let L_sun = (280.460 + 0.9856474 * D) % 360;
    let g_sun = (357.528 + 0.9856003 * D) % 360;
    let lambda_sun = (L_sun + 1.915 * Math.sin(g_sun * Math.PI/180) + 0.020 * Math.sin(2 * g_sun * Math.PI/180)) % 360;
    if(lambda_sun < 0) lambda_sun += 360;

    let L_moon = (218.316 + 13.1763965 * D) % 360;
    let M_moon = (134.963 + 13.0649930 * D) % 360;
    let lambda_moon = (L_moon + 6.289 * Math.sin(M_moon * Math.PI/180) - 1.274 * Math.sin((M_moon - 2*D)*Math.PI/180)) % 360;
    if(lambda_moon < 0) lambda_moon += 360;

    const ayanamsa = 23.85 + (D / 365.25) * (50.29 / 3600);
    const nir_sun = (lambda_sun - ayanamsa + 360) % 360;
    const nir_moon = (lambda_moon - ayanamsa + 360) % 360;

    const diff = (nir_moon - nir_sun + 360) % 360;
    
    const t_index = Math.floor(diff / 12);
    const n_index = Math.floor(nir_moon / (360/27));
    const y_index = Math.floor((nir_moon + nir_sun) % 360 / (360/27));
    const k_index = Math.floor(diff / 6);
    const v_index = now.getDay();

    return { t_index, n_index, y_index, k_index, v_index, ayanamsa, diff };
}

    document.getElementById('tithi-status').className = `inline-block px-3 py-1 rounded-full text-[0.65rem] font-bold tracking-widest uppercase ${t.color}`;
    document.getElementById('tithi-phase').innerText = t.phase;
    document.getElementById('tithi-deity').innerText = t.deity;

    const n = nakshatras[data.n_index];
    document.getElementById('nak-en').innerText = n.en;
    document.getElementById('nak-sa').innerText = n.sa;
    document.getElementById('nak-deity').innerText = n.deity;
    document.getElementById('nak-lord').innerText = n.lord;
    document.getElementById('nak-symbol').innerText = n.symbol;

    const v = varas[data.v_index];
    document.getElementById('vara-en').innerText = v.en;
    document.getElementById('vara-sa').innerText = v.sa;
    document.getElementById('vara-lord').innerText = v.lord;

    const y = yogas[data.y_index];
    document.getElementById('yoga-en').innerText = y.en;
    document.getElementById('yoga-sa').innerText = y.sa;
    document.getElementById('yoga-quality').innerText = y.quality;

    const k_idx_adjusted = data.k_index === 0 ? 10 : (data.k_index > 57 ? data.k_index - 50 : (data.k_index - 1) % 7);
    const k = karanas[k_idx_adjusted] || karanas[0];
    document.getElementById('karana-en').innerText = k.en;
    document.getElementById('karana-sa').innerText = k.sa;
    document.getElementById('karana-nature').innerText = k.nature;

    return data.diff;
}

const canvas = document.getElementById('moonCanvas');
const ctx = canvas.getContext('2d');
let time = 0;
let phaseAngle = 0;

function drawGeometry() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = 60;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.002);
    ctx.strokeStyle = "rgba(212, 175, 55, 0.15)";
    ctx.lineWidth = 1;
    
    ctx.beginPath();
    ctx.arc(0, 0, r + 30, 0, Math.PI * 2);
    ctx.stroke();

    for(let i=0; i<12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath();
        ctx.moveTo(r + 30, 0);
        ctx.lineTo(r + 45, 0);
        ctx.stroke();
    }
    
    ctx.rotate(-time * 0.004);
    for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.rect(-r-10, -r-10, (r+10)*2, (r+10)*2);
        ctx.stroke();
        ctx.rotate(Math.PI / 4);
    }
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowBlur = 30;
    ctx.shadowColor = "rgba(255, 255, 255, 0.2)";
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    const phase = phaseAngle / 360;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(212, 175, 55, 0.8)";
    
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2, phase > 0.5);
    const controlPoint = r * Math.abs(1 - (phase % 0.5) * 4);
    ctx.ellipse(0, 0, controlPoint, r, 0, Math.PI/2, -Math.PI/2, phase < 0.25 || phase > 0.75);
    ctx.fill();
    ctx.restore();

    time++;
    requestAnimationFrame(drawGeometry);
}

document.addEventListener("DOMContentLoaded", () => {
    phaseAngle = initData();
    drawGeometry();
    gsap.from(".bento-item", {
        y: 60,
        opacity: 0,
        duration: 1.2,
        stagger: 0.1,
        ease: "power4.out"
    });
});
</script>
